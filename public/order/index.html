<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order a project · Amir Codes Space</title>
  <meta name="description" content="Tell Amir about your project: send your contact details and a short brief.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🚀</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/order/order.css">
</head>
<body>
  <main class="wrap">
    <a class="back" href="/">← Back to the space</a>

    <header class="intro">
      <p class="kicker">// order a project</p>
      <h1>Let's build something.</h1>
      <p class="lead">Tell me who you are and what you have in mind. Your request lands straight in my inbox and I'll reply by email.</p>
    </header>

    <form id="order-form" class="card" novalidate>
      <div class="grid">
        <label class="field">
          <span>Your name <em>*</em></span>
          <input name="name" autocomplete="name" maxlength="100" required>
        </label>
        <label class="field">
          <span>Email <em>*</em></span>
          <input name="email" type="email" autocomplete="email" maxlength="200" required>
        </label>
        <label class="field">
          <span>Company <small>(optional)</small></span>
          <input name="company" autocomplete="organization" maxlength="120">
        </label>
        <label class="field">
          <span>Project type</span>
          <select name="type">
            <option value="">Choose one…</option>
            <option>Website</option>
            <option>Web app</option>
            <option>Mobile app</option>
            <option>3D / interactive experience</option>
            <option>MVP / prototype</option>
            <option>Other</option>
          </select>
        </label>
        <label class="field">
          <span>Budget <small>(optional)</small></span>
          <select name="budget">
            <option value="">Not sure yet</option>
            <option>Under €1k</option>
            <option>€1k – €5k</option>
            <option>€5k – €15k</option>
            <option>€15k+</option>
          </select>
        </label>
        <label class="field">
          <span>Timeline <small>(optional)</small></span>
          <select name="timeline">
            <option value="">Flexible</option>
            <option>ASAP</option>
            <option>Within a month</option>
            <option>1–3 months</option>
            <option>3+ months</option>
          </select>
        </label>
      </div>

      <label class="field">
        <span>Project brief <em>*</em></span>
        <textarea name="brief" rows="7" maxlength="5000" required placeholder="What should it do, who is it for, any links or references…"></textarea>
        <small class="count" aria-live="polite"><b id="brief-count">0</b> / 5000</small>
      </label>

      <!-- Honeypot: hidden from people, bots tend to fill it. -->
      <label class="hp" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off"></label>

      <p id="form-error" class="error" role="alert" hidden></p>
      <button class="submit" type="submit">Send request</button>
    </form>

    <section id="order-done" class="card done" hidden tabindex="-1">
      <div class="done-ic" aria-hidden="true">✓</div>
      <h2>Request sent!</h2>
      <p>Thanks — I've got your brief and will get back to you by email soon.</p>
      <a class="submit" href="/">Back to the space</a>
    </section>
  </main>
  <script type="module" src="/order/order.js"></script>
</body>
</html>
